name: Deploy Daily Morning Page to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Mode 1: If repository source is set to "GitHub Actions"
      - name: Setup GitHub Pages
        id: setup_pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Artifact
        if: steps.setup_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages (Actions Mode)
        if: steps.setup_pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4

      # Mode 2: If repository source is set to "Deploy from a branch" (main or gh-pages)
      - name: Sync to gh-pages branch (Branch Mode Fallback)
        if: steps.setup_pages.outcome != 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
