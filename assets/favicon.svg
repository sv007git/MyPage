<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E44"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="100%" stop-color="#FFE082"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#161b2e" />
  <!-- Radiant Sun rays -->
  <g stroke="#FFB74D" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="32" y1="6" x2="32" y2="10"/>
    <line x1="32" y1="54" x2="32" y2="58"/>
    <line x1="6" y1="32" x2="10" y2="32"/>
    <line x1="54" y1="32" x2="58" y2="32"/>
    <line x1="13.6" y1="13.6" x2="16.5" y2="16.5"/>
    <line x1="47.5" y1="47.5" x2="50.4" y2="50.4"/>
    <line x1="13.6" y1="50.4" x2="16.5" y2="47.5"/>
    <line x1="47.5" y1="16.5" x2="50.4" y2="13.6"/>
  </g>
  <!-- Sun disc -->
  <circle cx="32" cy="32" r="14" fill="url(#sunGrad)" filter="url(#glow)"/>
  <!-- Crescent Moon overlapping -->
  <path d="M 32 18 A 14 14 0 0 1 43.5 39.5 A 14 14 0 1 0 32 18 Z" fill="url(#moonGrad)"/>
</svg>